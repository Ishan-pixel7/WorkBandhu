<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — WorkBandhu</title>
    <link rel="stylesheet" href="forms.css" />
    <link rel="stylesheet" href="base.css" />    
  </head>
  <body>
    <header class="site-header"><div id="site-nav"></div></header>
    <main>
      <div class="auth-wrap">
        <div class="auth-card">
          <span class="eyebrow">Welcome back</span>
          <h2>Log in to WorkBandhu</h2>
          <div class="form-msg" id="form-msg"></div>
          <form id="login-form" novalidate>
            <div class="field" id="field-email">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
              />
              <small class="field-error" id="err-email"></small>
            </div>
            <div class="field" id="field-password">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <small class="field-error" id="err-password"></small>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              Log in
            </button>
          </form>
          <p class="auth-switch">
            New to WorkBandhu? <a href="register.html">Create an account</a>
          </p>
        </div>
      </div>
    </main>
    <footer class="site-footer"><div id="site-footer"></div></footer>
    <script src="auth.js"></script>
    <script src="validation.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (Auth.redirectIfLoggedIn()) return;
        Validate.liveField(
          "email",
          (v) => Validate.required(v, "Email") || Validate.email(v),
        );
        Validate.liveField("password", (v) => Validate.required(v, "Password"));
        const form = document.getElementById("login-form");
        const msg = document.getElementById("form-msg");
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          if (!Validate.loginForm(email, password)) {
            msg.textContent = "Please fix the highlighted fields.";
            msg.className = "form-msg error show";
            return;
          }
          const result = Auth.login(email, password);
          if (result.ok) {
            msg.textContent = "Logged in. Redirecting…";
            msg.className = "form-msg success show";
            const dest =
              result.user.role === "worker"
                ? "worker-dashboard.html"
                : "customer-dashboard.html";
            setTimeout(() => (window.location.href = dest), 500);
          } else {
            msg.textContent = result.error;
            msg.className = "form-msg error show";
          }
        });
      });
    </script>
  </body>
</html>
